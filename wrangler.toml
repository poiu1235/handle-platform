#   npx wrangler pages secret put RESET_TICKET_SECRET --project-name=handle-platform
# 加密存储，不进这个文件、也不进 git 历史。
[vars]
SUPABASE_URL = "https://toguggozkpjlfojjsqzw.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_oktLAso4PDw4flIBvkDrxQ_M7eLptK3"
VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAEWKp5fnOWpBMTe9"
# D5 访客模式总开关（wechat-login 未命中分支：true=建访客直接进，false=D3 原语义
# bound:false）。默认关，按设计 §10 两步上线翻转；翻转只影响「新建访客」，
# 已建访客走命中分支不受影响。
GUEST_MODE = "true"
MAIL_FROM= "Handle Notifications <notify@sys.handle.host>"
# ── 会员体系（PRD v3 8.3）────────────────────────────────────────────────
# 🔴 强制侧在这里，不在端上：端上那份 config/pro-feature.js 只管"画不画入口"，
#    服务端**绝不从请求体/请求头接收开关状态**（否则端上能自己把墙关掉）。
#    两侧不一致时唯一容错方向＝按更严的走，且要能被测出来（验收 #54）。
# 值恒为字符串：'true'/'1' 才算开，缺失/空串/拼错一律算关（fail-closed）。
# 三个都关＝现网行为：便利贴单一 500、余额与卡没有行数墙、没有购买入口
#（⚠️ 不是"免费档的新数值"，关态判据见 8.3 那四格）。
PRO_WALLS_ENABLED = "false"
# 🔴 **✅ E-14／E-15 判乙的前提（"入账代码不存在"）已随 B3-3 解除（2026-10-05）**：查单通道与入账
#   事务已落地（`_lib/proXpay.js` ＋ `_lib/proCredit.js`），端上确认态轮询也上线了
#   ⇒ 开闸条件从"B3-3 落地前必须 false"变成「**轮询在线即可，入站推送只是多一层兜底**」。
#   验真链路时的正确开法：这一条改 "true"、`PRO_TEST_OPENIDS` 保持有名单（＝内测形态，正常档也只给
#   名单内）、测试道具 1 分钱买一次 ⇒ 读完验收 #69 那五格后**立刻关回 false 并重新部署**
#   （这是"证据到手就关"，不是"内测收尾再关"）。
#   ⚠️ 只想验七条前置不用开它：关着拿真 Bearer 打 curl 会先撞 `purchase_disabled`，那本身就是判据。
# ✅ **2026-10-05 夜关回 false（四轮真机跑完，"证据到手就关"这一条兑现了）**：#64／#66⑤⑥／#69 五格、
#   #71（发货告知真跑）、#72（已退回包）、#73①②（握手＋首次真推）全部拿到一手结果并写进正本；
#   期间逼出并修掉 E-19（入账过滤匹配 0 行）、E-21（复用前先查单）、E-27（订单页永久转圈），
#   以及一次真并发撞车（轮询与推送同一秒抢同一单 ⇒ 库侧那道闸接住，无双入账）。
#   🔴 再要开闸的正当理由只剩四类（2026-10-06 更新）：① #65①②③⑤（七条前置各自的拒单文案，
#   关态没有入口所以只能在开的一侧看）；② #67②（iPhone 那支的结果句）；③ #73⑤（撤账后账户页
#   那一格肉眼核）；④ #65④（`deletion_pending`，owner 判先不跑）。
# ✅ **2026-10-06 owner 判"可以关了"** ⇒ 下面这条现在是 `false`。🔴 一条踩过的坑要留着：
#   上一段那句"2026-10-05 夜关回 false"当时**只改了注释、没改值**（值一直是 "true"，2026-10-06
#   读文件才抓到）⇒ 改这一行的值必须同批改上面那段说明，两边不一致时读注释的人会以为已关。
PRO_PURCHASE_ENABLED = "false"
# 判定认哪个 env 的账本行：0 现网／1 沙箱。D-10 已判 V1 不依赖 env=1 发货，
# 但这一列与这道隔离保留——它是"沙箱单发出真实会员"的唯一闸门
#（anomaly_reason 里的 env_mismatch 是打不到的死分支，别指望它）。
PRO_ENV = "0"
# 🔴 测试道具（monthly_test）与内测闸门的 openid 白名单，逗号分隔（§十一·丙 D-10 那条"不能省的守卫"）。
#   两个方向相反，别混成一个开关（判据在 functions/_lib/proCatalog.js）：
#     · 空 ＝ 发布形态：正常档人人可见可买，**测试档对谁都不给**（fail-closed）；
#     · 非空 ＝ 内测形态：正常档也只对名单内可见，测试档同样只给名单内。
#   名单里放的是 openid（伪匿名串，不是密钥），但它决定"谁能花几分钱买会员"⇒ 改动只走这里，
#   不许有端上副本、不许从请求里接收（8.3 第 1 条）。
# 🔴 下面这两个是**自测账号**（2365352545＝会员夹具号、304738837＝压墙数据号）。
#   非空＝内测形态：正常档也只对这两个人可见 ⇒ **对外发布前必须清空**（正本 E-13／6.5 上线顺序①）。
#   值取自 user_identities（Table Editor 可直接看到），不是端上能改的东西。
PRO_TEST_OPENIDS = "ob9w-3fSO7EjTCQTM2JyHacr2RsU,ob9w-3d6Ok8TsGaNSeu4nEWgzIiA"
# 虚拟支付的支付应用 ID（signData.offerId，6.3）。🔴 它不是密钥——它会随 signData 出现在端上，
# 与 AppID 同级（后台「虚拟支付 → 基本配置」那页本来就展示给开发者）。
# 但也不能填错：`offerId` 与 `goodsPrice` 都是 paySig 的组成部分 ⇒ 与后台发布的道具不一致，
# 表现就是"拉起支付直接被平台拒绝"，看起来像平台故障。
WX_PAY_OFFER_ID = "1450667285"
# 🔴 对应的那把 AppKey **只进 secret、不进本文件**，而且必须选「现网 AppKey」不是「沙箱 AppKey」：
#   D-10 已判 V1 不依赖沙箱发货、`PRO_ENV = "0"` ⇒ 签名走现网那把。
#   选错那把的失败形态不是"报错"，而是**签名全错**：下单直接被平台拒、推送也验不过，
#   日志里长得像"平台根本没推送"（正本 6.3 那条实证过的坑）。
#   npx wrangler pages secret put WX_PAY_APPKEY_PROD --project-name=handle-platform

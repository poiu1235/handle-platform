name = "handle-platform"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-08"

# 只放不敏感/本来就会暴露给客户端的值。
# SUPABASE_SERVICE_ROLE_KEY 和 RESET_TICKET_SECRET 绝不写在这里——
# 本地开发放 .dev.vars（已 gitignore），线上用
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name=handle-platform
#   npx wrangler pages secret put RESET_TICKET_SECRET --project-name=handle-platform
# 加密存储，不进这个文件、也不进 git 历史。
[vars]
SUPABASE_URL = "https://toguggozkpjlfojjsqzw.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_oktLAso4PDw4flIBvkDrxQ_M7eLptK3"
VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAEWKp5fnOWpBMTe9"
# D5 访客模式总开关（wechat-login 未命中分支：true=建访客直接进，false=D3 原语义
# bound:false）。默认关，按设计 §10 两步上线翻转；翻转只影响「新建访客」，
# 已建访客走命中分支不受影响。
GUEST_MODE = "true"
MAIL_FROM= "Handle Notifications <notify@sys.handle.host>"
# ── 会员体系（PRD v3 8.3）────────────────────────────────────────────────
# 🔴 强制侧在这里，不在端上：端上那份 config/pro-feature.js 只管"画不画入口"，
#    服务端**绝不从请求体/请求头接收开关状态**（否则端上能自己把墙关掉）。
#    两侧不一致时唯一容错方向＝按更严的走，且要能被测出来（验收 #54）。
# 值恒为字符串：'true'/'1' 才算开，缺失/空串/拼错一律算关（fail-closed）。
# 三个都关＝现网行为：便利贴单一 500、余额与卡没有行数墙、没有购买入口
#（⚠️ 不是"免费档的新数值"，关态判据见 8.3 那四格）。
PRO_WALLS_ENABLED = "false"
PRO_PURCHASE_ENABLED = "false"
# 判定认哪个 env 的账本行：0 现网／1 沙箱。D-10 已判 V1 不依赖 env=1 发货，
# 但这一列与这道隔离保留——它是"沙箱单发出真实会员"的唯一闸门
#（anomaly_reason 里的 env_mismatch 是打不到的死分支，别指望它）。
PRO_ENV = "0"
# 🔴 测试档（pro_test_day）与内测闸门的 openid 白名单，逗号分隔（§十一·丙 D-10 那条"不能省的守卫"）。
#   两个方向相反，别混成一个开关（判据在 functions/_lib/proCatalog.js）：
#     · 空 ＝ 发布形态：正常档人人可见可买，**测试档对谁都不给**（fail-closed）；
#     · 非空 ＝ 内测形态：正常档也只对名单内可见，测试档同样只给名单内。
#   名单里放的是 openid（伪匿名串，不是密钥），但它决定"谁能花几分钱买会员"⇒ 改动只走这里，
#   不许有端上副本、不许从请求里接收（8.3 第 1 条）。
PRO_TEST_OPENIDS = ""
# 虚拟支付的商户号（signData.offerId，6.3）。🔴 它不是密钥（会随 signData 出现在端上），
# 但也不能瞎填：`goodsPrice` 与 `offerId` 都是 paySig 的组成部分 ⇒ 与后台发布的道具不一致，
# 表现就是"拉起支付直接被平台拒绝"。⚠️ 对应的 AppKey **只进 secret**（下面那两行注释），别写这里。
WX_PAY_OFFER_ID = ""
# 将来 B3/B4 要加的两把**只进 secret、不进本文件**（选错那把的失败形态长得像"平台没推送"）：
#   npx wrangler pages secret put WX_PAY_APPKEY_PROD      # 现网 AppKey（签名用）
#   npx wrangler pages secret put PRO_ADMIN_TOKEN         # 4.6 入口④管理端鉴权